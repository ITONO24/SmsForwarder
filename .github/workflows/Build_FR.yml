name: Build APK (FR)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*universal*.apk DigiSMS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigiSMS
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: digisms-${{ github.run_number }}
          name: Digi SMS ${{ github.run_number }}
          body: "Digi SMS — version française réalisée par Itono Studio (basée sur SmsForwarder de pppscn). Guide : docs/GUIDE_FR.md"
          files: DigiSMS.apk
